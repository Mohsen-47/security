#spring.application.name=security
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/security
    hikari:
      #jdbc-url: jdbc:postgresql://localhost:5432/sec_jwt
      username: postgres
      password: 123
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 47
logging:
  level:
    root: error
    sql: trace
    web: error